<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="player" id="player">
    <div class="cover" id="cover">♪</div>

    <div class="info">
      <h1 id="title">No track</h1>
      <p id="artist">Add a song to start</p>
    </div>

    <div class="progress-area">
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="Seek">
      <div class="times">
        <span id="current">0:00</span>
        <span id="duration">0:00</span>
      </div>
    </div>

    <div class="controls">
      <button id="shuffle" class="btn small" title="Shuffle" aria-pressed="false">⇄</button>
      <button id="prev" class="btn" title="Previous">⏮</button>
      <button id="play" class="btn main" title="Play / Pause">▶</button>
      <button id="next" class="btn" title="Next">⏭</button>
      <button id="repeat" class="btn small" title="Repeat" aria-pressed="false">⟲</button>
    </div>

    <div class="volume">
      <span id="muteBtn" class="mute" title="Mute">🔊</span>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
    </div>

    <div class="playlist-head">
      <h2>Playlist</h2>
      <label class="add-btn">
        + Add songs
        <input type="file" id="fileInput" accept="audio/*" multiple hidden>
      </label>
    </div>
    <ul class="playlist" id="playlist"></ul>
  </main>

  <div class="signature">Shahrzad Dadkhah</div>

  <audio id="audio" preload="metadata"></audio>
  <script src="script.js"></script>
</body>
</html>
